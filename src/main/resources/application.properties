# Secrets come from environment variables (Heroku config vars). For local runs,
# put them in a git-ignored .env file at the project root, one KEY=value per line.
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver
# Heroku Postgres: the Java buildpack derives these from the add-on's DATABASE_URL, so
# they follow Heroku's credential rotations without any manual config var.
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}

spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

# Movie Recommendation Engine - TMDB provider (first vertical).
tmdb.api.key=${TMDB_API_KEY}
tmdb.api.base-url=https://api.themoviedb.org/3/

# Movie Recommendation Engine - OMDb ratings enricher. Set the key before use.
omdb.api.key=${OMDB_API_KEY:}
omdb.api.base-url=https://www.omdbapi.com/

# Legacy apps - mail and WhatsApp credentials.
magic-email.imap.password=${MAGIC_EMAIL_IMAP_PASSWORD}
magic-email.smtp.password=${MAGIC_EMAIL_SMTP_PASSWORD}
web-mail.password=${WEB_MAIL_PASSWORD}
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}

# JC Travels - writes to travels-api need the X-Api-Key header. While ENFORCE is false a
# missing key is only logged (the Cordova app sends none); set it to true once retired.
jctravels.api-key=${JCTRAVELS_API_KEY:}
jctravels.api-key-enforce=${JCTRAVELS_API_KEY_ENFORCE:false}
